[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-model-accuracy"
version = "0.1.0"
description = "Find the most accurate weather forecast model for your location and get a forecast using it"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
weather-model-accuracy = "weather_model_accuracy:app"

[tool.setuptools]
py-modules = ["weather_model_accuracy", "weather_api"]
